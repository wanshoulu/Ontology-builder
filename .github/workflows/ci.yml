name: CI
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/ci.yml']
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build
        working-directory: web
